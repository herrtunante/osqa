{% load i18n %}

<div class="boxC sidebar-awards">
    <h3>{% trans "Recent awards" %}</h3>
    <div class="body">
         <ul class="badge-list">
         {% for award in awards %}
            <li>
            <a href="{% url "badges" %}{{award.badge.id}}/{{award.badge.name|slugify}}" title="{{ award.badge.description }}" class="medal">
            <span class="badge{{ award.badge.type }}" aria-hidden="true">&#9679;</span>&nbsp;{{ award.badge.name }}</a>
            <a class="badge-list-user" href="{{ award.user.get_profile_url }}">{{ award.user.decorated_name }}</a>
            </li>
        {% endfor %}
        </ul>
        <p class="more"><a href="{% url "badges" %}">{% trans "all awards" %}</a></p>
     </div>
</div>
