{% comment %}A call-to-action button: include with url=... label=... (the layout's styles are in the context).{% endcomment %}<table role="presentation" class="em-button em-button-table" cellpadding="0" cellspacing="0" border="0" style="margin:8px 0 24px 0;">
<tr><td align="center" bgcolor="{{ brand_color }}" style="{{ button_cell_style }}"><a href="{{ url }}" target="_blank" style="{{ button_style }}">{{ label }}</a></td></tr>
</table>
