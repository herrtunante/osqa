{% load i18n extra_tags %}

<p>
{% blocktrans %}
Would you like to copy the permanent link to your clipboard?
{% endblocktrans %}
</p>

{% spaceless %}
<p><label for="permanent_link_url" style="font-size: 13px;">{% trans "Permanent link" %}:</label></p>
<p><textarea id="permanent_link_url" name="permanent_link_url" style="font-size: 12px;" readonly="readonly">{{ url }}</textarea></p>
{% endspaceless %}

<script type="text/javascript">
$(function() {
    var url = '{{ url|escapejs }}';

    $('#permanent_link_url').on('click', function() {
        $(this).select();
    });

    // The dialog's OK button copies the link.
    $(document).off('click.permalink').on('click.permalink', '#copy_clip_button', function() {
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(url);
        } else {
            var $field = $('#permanent_link_url');
            $field.trigger('select');
            try { document.execCommand('copy'); } catch (e) {}
        }
    });
});
</script>
