{% load extra_tags %}
<div class='post-update-info'>
    <p class="post-update-info-when">
        <strong>{% diff_date revision.revised_at %}</strong>
    </p>
    <div class="post-update-info-who">
        <a href="{{ revision.author.get_profile_url }}" class="post-update-info-avatar">{% gravatar revision.author 32 %}</a>
        <p><a href="{{ revision.author.get_profile_url }}">{{ revision.author.username }}</a><br/>
        {% get_score_badge revision.author %}</p>
    </div>
</div>
