{% load i18n %}{# "Sign in with a passkey" (media/js/osqa.passkeys.js): hidden until the script finds WebAuthn in the browser. #}
<div class="auth-passkey" data-passkey-signin data-options-url="{% url "passkey_auth_options" %}" data-verify-url="{% url "passkey_auth" %}" hidden>
    <div class="auth-divider"><span>{% trans "or" %}</span></div>
    <button type="button" class="auth-provider auth-passkey-button" data-passkey-button>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><circle cx="8" cy="9" r="4"/><path d="M2 20c0-3.3 2.7-6 6-6 1.2 0 2.3.3 3.2.9"/><circle cx="17.5" cy="13.5" r="2.5"/><path d="M17.5 16v5l1.5-1.2M17.5 18.5l1.5-1"/></svg>
        <span>{% trans "Sign in with a passkey" %}</span>
    </button>
    <p class="auth-error auth-passkey-error" role="alert" data-passkey-error hidden></p>
</div>
{# Shown before the first paint where osqa.passkeys.js will offer it (no layout shift when it runs). #}
<script nonce="{{ csp_nonce }}">if (window.PublicKeyCredential && navigator.credentials && window.fetch) { document.currentScript.previousElementSibling.hidden = false; }</script>
