{% load i18n %}
{% load humanize %}

{% if tags %}
    <div class="boxC sidebar-tags">
        <h3 class="subtitle">{% trans "Related tags" %}</h3>
        <ul class="tags related-tags" id="recent-tags">
            {% for tag in tags %}
                <li><a rel="tag" class="tag-link-{{ tag.name }}" href="{% url "tag_questions" tag.name|urlencode %}">{{ tag.name }}</a>
                <span class="tag-number">&#215;&nbsp;{{ tag.used_count|intcomma }}</span></li>
            {% endfor %}
        </ul>
    </div>
{% endif %}
