{% load i18n %}

<div class="tabsA">
    <a id="active" href="{{ base_url }}active"{% if current == "active" %} class="on"{% endif %} title="{% trans "most recently updated questions" %}">{% trans "active" %}</a>
    <a id="latest" href="{{ base_url }}latest"{% if current == "latest" %} class="on"{% endif %} title="{% trans "most recently asked questions" %}">{% trans "newest" %}</a>
    <a id="hottest" href="{{ base_url }}hottest"{% if current == "hottest" %} class="on"{% endif %} title="{% trans "hottest questions" %}">{% trans "hottest" %}</a>
    <a id="mostvoted" href="{{ base_url }}mostvoted"{% if current == "mostvoted" %} class="on"{% endif %} title="{% trans "most voted questions" %}">{% trans "most voted" %}</a>
</div>
