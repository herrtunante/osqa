{% load i18n %}
{% spaceless %}
<nav class="sort-tabs" aria-label="{% trans "Sort by" %}">
<div class="tabsA">
    {% for name, label, url, descr in sorts %}
        <a href="{{ url }}" data-sort="{{ name }}"{% if current == name %} class="on" aria-current="true"{% endif %} title="{{ descr }}">{{ label }}</a>
    {% endfor %}
</div>
</nav>
{% endspaceless %}
