{% load i18n %}

<div class="profile-dialog">
    <h2>{% trans "Report user" %}</h2>
    <label for="report-publicmsg">{% trans "Public message" %}</label>
    <textarea id="report-publicmsg" rows="3" name="publicmsg" cols="35" aria-describedby="report-publicmsg-help"></textarea>
    <p class="profile-dialog-help" id="report-publicmsg-help">{% trans "This message will be visible through the user activity log." %}</p>
</div>
