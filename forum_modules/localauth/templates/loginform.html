{% load i18n %}
<div class="auth-field">
    <label for="id_username">{% trans "Username or email" %}</label>
    <input id="id_username" type="text" name="username" maxlength="254" value="{{ username }}" required autofocus
           autocomplete="username webauthn" autocapitalize="none" spellcheck="false"{% if msg and username %} aria-invalid="true" aria-describedby="signin-error"{% endif %} />
</div>
<div class="auth-field">
    <div class="auth-label-row">
        <label for="id_password">{% trans "Password" %}</label>
        <a href="{% url "auth_request_tempsignin" %}">{% trans "Forgot your password?" %}</a>
    </div>
    <div class="password-field">
        <input id="id_password" type="password" name="password" maxlength="128" required autocomplete="current-password"{% if msg and username %} aria-invalid="true" aria-describedby="signin-error"{% endif %} />
        {% include "auth/password_toggle.html" with input_id="id_password" %}
    </div>
</div>
<div class="auth-check">
    <input type="checkbox" id="id_remember" name="remember" value="1" checked aria-describedby="id_remember-help" />
    <div>
        <label for="id_remember">{% trans "Keep me signed in" %}</label>
        <p class="auth-help" id="id_remember-help">{% trans "For two weeks on this device. Leave it unticked on a shared computer." %}</p>
    </div>
</div>
<button id="blogin" name="blogin" type="submit" class="auth-submit">{% trans "Sign in" %}</button>
