# Secrets for OSQA. Don't commit real values: create the Secret from a local
# file instead, e.g.
#   kubectl -n osqa create secret generic osqa-secrets \
#     --from-literal=OSQA_SECRET_KEY="$(python3 -c 'from secrets import token_urlsafe; print(token_urlsafe(50))')" \
#     --from-literal=OSQA_DB_PASSWORD='...' \
#     --from-literal=METRICS_TOKEN="$(python3 -c 'from secrets import token_urlsafe; print(token_urlsafe(32))')" \
#     --from-literal=SENTRY_DSN=''
# or with an external secrets operator. This file shows the keys only.
apiVersion: v1
kind: Secret
metadata:
  name: osqa-secrets
type: Opaque
stringData:
  OSQA_SECRET_KEY: "change-me-50-random-characters"
  OSQA_DB_PASSWORD: "change-me"
  # Enables /metrics; Prometheus sends it as "Authorization: Bearer <token>".
  METRICS_TOKEN: "change-me"
  SENTRY_DSN: ""
