name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install MySQL client headers (for mysqlclient)
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - run: pip install -r requirements-dev.txt
      - name: Check for missing migrations
        run: OSQA_SETTINGS_LOCAL=settings_local_test python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: OSQA_SETTINGS_LOCAL=settings_local_test python manage.py test forum.tests

  audit:
    # Known vulnerabilities in the pinned dependencies (PyPI advisory database).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install MySQL client headers (for mysqlclient)
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - run: pip install -r requirements.txt pip-audit
      # Audits everything installed, including indirect dependencies.
      - run: pip-audit --progress-spinner off
