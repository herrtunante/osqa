# Tool configuration only: OSQA is a Django project, not an installable package.

[tool.ruff]
target-version = "py312"
extend-exclude = [
    "forum/migrations",
    "e2e/vendor",
    "forum/skins/default/media/vendor",
    "tmp",
    "cache",
    "log",
]

[tool.ruff.lint]
# pyflakes, the error-prone pycodestyle checks, whitespace warnings,
# a subset of bugbear and the Python 3 upgrades.
select = ["F", "E4", "E7", "E9", "W", "B", "UP"]
ignore = [
    "F403", "F405",  # `from x import *` is how forum.models, forum.settings and the modules share names
    "E402",          # imports after sys.path / settings setup in settings.py, scripts and modules
    "E701", "E702",  # several statements on one line (style)
    "E722",          # bare except: changing what is caught needs a case-by-case review
    "E731",          # lambda assignment (style)
    "E741",          # ambiguous variable names (style)
    "B007",          # unused loop variable (style)
    "B008",          # function calls in defaults
    "B904",          # raise ... from inside except (style)
    "B905",          # zip() without strict=
    "UP031",         # %-formatting: rewriting 900 strings is churn, not a fix
]

[tool.ruff.lint.per-file-ignores]
# Re-export modules: their imports are the package interface.
"__init__.py" = ["F401"]
# Modules read with `from x import *`: their imports reach the importing module.
"forum/actions/node.py" = ["F401"]
"forum/actions/user.py" = ["F401"]
"forum/forms/admin.py" = ["F401"]
"forum/forms/auth.py" = ["F401"]
"forum/forms/general.py" = ["F401"]
"forum/forms/qanda.py" = ["F401"]
"forum/models/base.py" = ["F401"]
"forum/modules/ui_objects.py" = ["F401"]
# Names come from `from settings_local import *`.
"settings.py" = ["F821"]
# Trailing space inside a translated help text (changing it changes the msgid).
"forum_modules/default_badges/settings.py" = ["W291"]

# To be cleaned after the CSP/email/CSS work (files other changes are touching).
"forum/middleware/admin_messages.py" = ["F401", "UP004"]
